# yaml-language-server: $schema=node_modules/@pc-nexus/manifest/schema/manifest.schema.json
app:
  version: 1.0.0
extensions:
  - key: nexus-hello-world-react-custom-ui-project-page
    resource: main
    target: pcm:pjm:project:page
    resolver:
      function: resolver
    title: Hello World
    route: hello-world
functions:
  - key: resolver
    handler: index.resolver
resources:
  - key: main
    path: web/main/dist
permissions:
  scopes: []
