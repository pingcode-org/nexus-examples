# yaml-language-server: $schema=node_modules/@pc-nexus/manifest/schema/manifest.schema.json
app:
  version: 1.1.0
extensions:
  - key: nexus-project-attachments-project-page
    target: pcm:pjm:project:page
    title: 附件
    resource: main
    resolver:
      function: resolver
    route: attachments
  - key: nexus-project-attachments-background
    target: pcm:global:main:background
    resource: background
    resolver:
      function: resolver
functions:
  - key: resolver
    handler: index.resolver
  - key: batch-download-consumer
    handler: index.batchDownloadConsumer
async:
  queues:
    - key: batch-download
  consumers:
    - key: batch-download-consumer
      queue: batch-download
      handler:
        function: batch-download-consumer
      concurrency: 2
resources:
  - key: main
    path: web/main/dist
  - key: background
    path: web/background/dist
storage:
  entities:
    - name: attachment
      attributes:
        - name: id
          type: string
          required: true
        - name: project_id
          type: string
          required: true
        - name: name
          type: string
          required: true
        - name: object_key
          type: string
          required: true
        - name: size
          type: number
        - name: mime_type
          type: string
        - name: checksum
          type: string
        - name: uploader_id
          type: string
        - name: uploaded_at
          type: number
      indexes:
        - name: project_id_
          keys:
            - project_id: 1
permissions:
  scopes:
    - pcp:storage:app
    - pcp:read:global:team
  content:
    styles:
      - unsafe-inline
  external:
    fetch:
      backend:
        # NOS 预签名地址由平台返回，域名不固定，消费者需要在服务端读取文件。
        - "*"
